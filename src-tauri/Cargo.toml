[package]
name = "i-code"
version = "0.1.1"
description = "Local AI Gateway & CLI Config Manager"
authors = ["i-code"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
# ===== Tauri 框架与官方插件 =====
tauri = { version = "2.4.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.2.0"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2.0.0"
tauri-plugin-process = "2.2.0"
# tauri-plugin-store = "2.2.0"  # 预留：用于非敏感的应用偏好持久化（如迷你面板尺寸）

# ===== 序列化与类型生成 =====
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "0.4"
toml = "0.8"
# Rust struct → TypeScript 类型自动生成，保持前后端类型一致
ts-rs = { version = "10", features = ["chrono-impl", "uuid-impl", "no-serde-warnings"] }

# ===== 数据库 =====
# SQLite 驱动，bundled 特性内置 SQLite 二进制，避免依赖系统 SQLite
rusqlite = { version = "0.32", features = ["bundled", "chrono", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
# reflink 用于备份时快速复制数据库文件（写时复制）
reflink = "0.1"

# ===== 异步运行时与 HTTP 客户端 =====
tokio = { version = "1.0", features = ["full"] }
# rustls-tls-native-roots：读取系统证书存储（Windows 证书库），支持信任用户安装的代理 MITM 根证书
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "socks", "blocking"] }
# URL 解析（脚本 HTTP host 白名单）
url = "2"
# futures 用于流式响应处理
futures = "0.3"
# WebSocket 客户端：OpenAI Responses API WebSocket 传输（transport=websocket）
# rustls-tls-native-roots：与 reqwest 一致使用系统证书存储（Windows 证书库）
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-native-roots"] }

# ===== 本地 HTTP 网关 Server =====
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
hyper = { version = "1", features = ["full"] }

# ===== 加密与安全 =====
# AES-GCM 用于本地加密存储敏感数据
aes-gcm = "0.10"
# 生成随机数与密钥
rand = "0.8"
# 密钥派生（从用户密码派生加密密钥）
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
# base64 编解码（用于配置导入/导出）
base64 = "0.22"
hex = "0.4"

# ===== 通用工具 =====
# UUID 生成（保留给运行时随机 token / 请求 ID 等非表主键场景）
uuid = { version = "1", features = ["v4", "v5", "serde"] }
# 雪花 ID 生成（数据库表主键）
rs-snowflake = "0.6"
# 时间戳处理
chrono = { version = "0.4", features = ["serde"] }
# 异步 trait 支持
async-trait = "0.1"
# 错误链
thiserror = "1.0"
anyhow = "1.0"
# 日志门面（tracing 的 log feature 依赖 log crate 桥接现有 log:: 宏调用）
log = "0.4"
# tracing 生态：替代 tauri-plugin-log，获得请求级 span 上下文、结构化日志
# - tracing 的 log feature：tracing 事件 → log 记录（tracing→log 方向）
# - tracing-log 的 LogTracer：log:: 宏 → tracing 事件（log→tracing 方向）
#   桥接现有 180 处 log::info! 等宏调用，零改动继续工作
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
tracing-log = "0.2"
# 文件按天滚动 appender（配合自定义 SizeAwareFileAppender 实现按大小分片）
tracing-appender = "0.2"
# 正则（用于内置模型别名匹配、Secret 引用扫描）
regex = "1"
# once_cell 用于全局静态初始化
once_cell = "1"
# 系统信息（内存监控）
sysinfo = "0.33"
# 目录路径处理
dirs = "5"
# 在 PATH 中查找可执行文件
which = "7"
# zip 备份压缩
zip = "2"
# WebDAV PROPFIND XML 解析
quick-xml = "0.36"
# tiktoken BPE 分词器（纯 Rust 实现，支持 OpenAI / DeepSeek / Llama3 等编码）
tiktoken = "3"
# Rhai 脚本引擎：额度监控自定义脚本（禁文件系统相关能力）
rhai = { version = "1", default-features = false, features = ["sync", "serde"] }
# 本机网卡地址枚举：网关监听 0.0.0.0 时用于列出可访问本机的 LAN 地址
local-ip-address = "0.6"

[dev-dependencies]
# 测试用临时目录（SizeAwareFileAppender 单元测试用）
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
